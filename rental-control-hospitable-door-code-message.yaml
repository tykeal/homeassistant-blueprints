---
# SPDX-License-Identifier: MIT
# SPDX-FileCopyrightText: 2026 Andrew Grimberg <tykeal@bardicgrove.org>
blueprint:
  name: Rental Control Hospitable Door Code Message (v0.1)
  description: |
    Messages the guest their Rental Control door code through
    Hospitable. Hospitable personal access tokens cannot write a door
    code to the reservation, so the code generated by Rental Control
    is sent to the guest as a message with hospitable.send_message.

    Test mode is ON by default. While it is on, the rendered message
    is sent to the test notify action instead of the guest. Turn it
    off only after checking the messages look right.

    The To-do list used to track sent messages MUST be dedicated to
    this automation. Items in it are created, updated and removed
    automatically.

  domain: automation

  input:
    rental_control_calendar:
      name: Rental Control Calendar
      description: >-
        The calendar associated with the rental control device
      selector:
        entity:
          domain: calendar
          integration: rental_control
    hospitable_config_entry:
      name: Hospitable Account
      description: >-
        The Hospitable account to use. Only needed when more than one
        Hospitable account is configured.
      default: ""
      selector:
        config_entry:
          integration: hospitable
    max_events:
      name: Max Events
      description: |
        Number of Rental Control event sensors to check. This
        should match the max_events setting in the Rental Control
        configuration.
      default: 5
      selector:
        number:
          min: 1
          max: 10
          mode: box
    check_interval:
      name: Check Interval (Hours)
      description: >-
        How often to run the periodic sync.
      default: "/1"
      selector:
        select:
          options:
            - label: Every hour
              value: "/1"
            - label: Every 2 hours
              value: "/2"
            - label: Every 3 hours
              value: "/3"
            - label: Every 4 hours
              value: "/4"
            - label: Every 6 hours
              value: "/6"
            - label: Every 8 hours
              value: "/8"
            - label: Every 12 hours
              value: "/12"
            - label: Once daily
              value: "/24"
    sent_tracker:
      name: Sent Message Tracker
      description: >-
        A dedicated To-do list (e.g. a Local To-do helper) used to
        remember what was sent. One item per reservation (summary =
        reservation UUID, description = door code sent, due date =
        check-out date). Delete an item to allow the message to be
        sent again. Items are removed automatically after check-out.
        The list must support item descriptions and due dates.
      selector:
        entity:
          filter:
            - domain: todo
              supported_features:
                - todo.TodoListEntityFeature.SET_DESCRIPTION_ON_ITEM
    send_immediately:
      name: Send Immediately
      description: >-
        Send the message as soon as Rental Control assigns a door code
        instead of waiting for the send window.
      default: false
      selector:
        boolean:
    hours_before_checkin:
      name: Hours Before Check-in
      description: >-
        How many hours before check-in to send the message. Ignored
        when Send Immediately is on.
      default: 24
      selector:
        number:
          min: 1
          max: 336
          step: 1
          mode: box
    message_template:
      name: Message Template
      description: >-
        The message sent to the guest. Available placeholders:
        {{ guest_first_name }}, {{ door_code }}, {{ check_in }},
        {{ check_out }}, {{ property_name }} and
        {{ reservation_uuid }}. Plain text only; HTML is not
        supported. Line breaks are kept.
      default: |-
        Hi {{ guest_first_name }},

        Your door code for {{ property_name }} is {{ door_code }}.
        It works from {{ check_in }} until {{ check_out }}.

        Enjoy your stay!
      selector:
        text:
          multiline: true
    resend_on_code_change:
      name: Resend On Code Change
      description: >-
        If Rental Control changes the door code after a message was
        sent, send a corrected message.
      default: true
      selector:
        boolean:
    correction_template:
      name: Correction Message Template
      description: >-
        The message sent when the door code changed after a message
        was already sent. Leave blank to reuse the message template.
        Same placeholders as the message template. Suggested wording:
        "Hi {{ guest_first_name }}, your door code for
        {{ property_name }} has changed. Your new code is
        {{ door_code }}. Please disregard the previous code."
      default: ""
      selector:
        text:
          multiline: true
    test_mode:
      name: Test Mode
      description: >-
        When on, the rendered message is sent to the test notify
        action instead of the guest and nothing is recorded in the
        To-do list, so a test notification is sent on every run while
        a reservation is in its send window.
      default: true
      selector:
        boolean:
    test_notify_service:
      name: Test Notify Action
      description: >-
        The notify action to call in test mode, e.g.
        notify.mobile_app_my_phone. Required when test mode is on.
      default: ""
      selector:
        text:
          multiline: false

mode: single
max_exceeded: silent

variables:
  rc: !input rental_control_calendar
  max_events: !input max_events
  hospitable_config_entry: !input hospitable_config_entry
  sent_tracker: !input sent_tracker
  send_immediately: !input send_immediately
  hours_before_checkin: !input hours_before_checkin
  resend_on_code_change: !input resend_on_code_change
  test_mode: !input test_mode
  test_notify_service: !input test_notify_service

  # Derived
  rc_device: "{{ device_name(rc) | slugify }}"
  rc_event_entities: >-
    {%- set ns = namespace(entities=[]) -%}
    {%- for i in range(max_events | int) -%}
      {%- set ns.entities = ns.entities +
      ['sensor.rental_control_' ~ rc_device
      ~ '_event_' ~ i,
      'sensor.' ~ rc_device
      ~ '_rental_control_event_' ~ i] -%}
    {%- endfor -%}
    {{ ns.entities }}
  hospitable_extra: >-
    {{ {'config_entry_id': hospitable_config_entry}
    if hospitable_config_entry | default('', true)
    | string | trim != '' else {} }}
  uid_suffix: "@reservations.hospitable.com"
  log_name: blueprints.rental_control_hospitable_door_code_message

triggers:
  - trigger: state
    entity_id: !input rental_control_calendar
    id: calendar_update
  - trigger: time_pattern
    hours: !input check_interval
    id: periodic_sync
  # state_changed fires for every entity; the condition below
  # filters to our event sensors. HA state triggers do not
  # support templated entity_id, so this is the recommended
  # workaround for dynamically derived entity lists.
  - trigger: event
    event_type: state_changed
    id: event_sensor_update

conditions:
  - condition: template
    value_template: >-
      {{ trigger.id != 'event_sensor_update'
      or trigger.event.data.entity_id
      in rc_event_entities }}

actions:
  - if:
      - condition: template
        value_template: >-
          {{ test_mode
          and test_notify_service | default('', true)
          | string | trim == '' }}
    then:
      - action: system_log.write
        data:
          level: error
          logger: "{{ log_name }}"
          message: >-
            Test mode is on but no test notify action is set;
            no messages were sent.
      - stop: Test notify action not set
  # create, delete, update, due date and description
  - if:
      - condition: template
        value_template: >-
          {{ state_attr(sent_tracker, 'supported_features')
          | int(0) | bitwise_and(87) != 87 }}
    then:
      - action: system_log.write
        data:
          level: error
          logger: "{{ log_name }}"
          message: >-
            {{ sent_tracker }} does not support item descriptions and
            due dates; no messages were sent.
      - stop: Unsupported sent tracker
  - repeat:
      count: "{{ max_events | int }}"
      sequence:
        - variables:
            event_index: "{{ repeat.index - 1 }}"
            event_entity_old: >-
              sensor.rental_control_{{ rc_device
              }}_event_{{ event_index }}
            event_entity_new: >-
              sensor.{{ rc_device
              }}_rental_control_event_{{ event_index }}
            event_entity: >-
              {{ event_entity_new
              if has_value(event_entity_new)
              else event_entity_old }}
        - if:
            - condition: template
              value_template: >-
                {{ has_value(event_entity)
                and state_attr(event_entity, 'slot_code')
                not in [None, '']
                and state_attr(event_entity, 'start')
                not in [None, '']
                and state_attr(event_entity, 'end')
                not in [None, '']
                and state_attr(event_entity, 'uid')
                not in [None, '']
                and (state_attr(event_entity, 'uid') | string)
                .endswith(uid_suffix) }}
          then:
            # Re-read the tracker before every send decision so a
            # record written earlier in this run is always seen.
            - action: todo.get_items
              target:
                entity_id: "{{ sent_tracker }}"
              data:
                status:
                  - needs_action
                  - completed
              response_variable: tracker_response
            - variables:
                sent_items: >-
                  {%- set ns = namespace(items=[]) -%}
                  {%- set resp = tracker_response
                  if tracker_response is mapping else {} -%}
                  {%- set raw = (resp.get(sent_tracker) or {}).get('items')
                  or [] -%}
                  {%- for i in raw -%}
                    {%- set ns.items = ns.items + [{
                    'uid': i.uid | default('', true) | string,
                    'summary': i.summary | default('', true) | string,
                    'description': i.description
                    | default('', true) | string | trim,
                    'due': (i.due | default('', true) | string)[:10]
                    }] -%}
                  {%- endfor -%}
                  {{ ns.items }}
            - variables:
                door_code: >-
                  {{ state_attr(event_entity,
                  'slot_code') | string }}
                event_uid: >-
                  {{ state_attr(event_entity, 'uid') | string }}
                reservation_uuid: >-
                  {{ event_uid[:-(uid_suffix | length)] }}
                rc_start: >-
                  {{ as_datetime(
                  state_attr(event_entity, 'start')) }}
                rc_end: >-
                  {{ as_datetime(
                  state_attr(event_entity, 'end')) }}
                # Guard against the same reservation appearing on
                # more than one event sensor in a single run.
                duplicate_event: >-
                  {%- set ns = namespace(dup=false) -%}
                  {%- for j in range(event_index | int) -%}
                    {%- set n = 'sensor.' ~ rc_device
                    ~ '_rental_control_event_' ~ j -%}
                    {%- set o = 'sensor.rental_control_'
                    ~ rc_device ~ '_event_' ~ j -%}
                    {%- set e = n if has_value(n) else o -%}
                    {%- if state_attr(e, 'uid') | string
                    == event_uid -%}
                      {%- set ns.dup = true -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.dup }}
                tracker_matches: >-
                  {{ sent_items
                  | selectattr('summary', 'eq', reservation_uuid)
                  | list }}
                already_sent: >-
                  {{ tracker_matches
                  | selectattr('description', 'eq',
                  door_code | string)
                  | list | count > 0 }}
                is_correction: >-
                  {{ tracker_matches | count > 0
                  and not already_sent }}
                in_window: >-
                  {{ send_immediately
                  or now() >= as_datetime(rc_start)
                  - timedelta(hours=hours_before_checkin | int) }}
                should_send: >-
                  {{ not duplicate_event
                  and reservation_uuid | length > 0
                  and as_datetime(rc_end) > now()
                  and in_window
                  and not already_sent
                  and (not is_correction
                  or resend_on_code_change) }}
            - if:
                - condition: template
                  value_template: "{{ should_send }}"
              then:
                - variables:
                    find_result: {}
                - action: hospitable.find_reservation
                  continue_on_error: true
                  data: >-
                    {{ dict(hospitable_extra,
                    reservation_uuid=reservation_uuid) }}
                  response_variable: find_result
                - variables:
                    reservation: >-
                      {{ find_result.reservation
                      if find_result is mapping
                      and find_result.found | default(false)
                      and find_result.reservation is mapping
                      else {} }}
                    reservation_status: >-
                      {{ ((reservation.reservation_status
                      | default({}, true)).current
                      | default({}, true)).category
                      | default('unknown', true) | string }}
                - if:
                    - condition: template
                      value_template: >-
                        {{ reservation | count == 0
                        or reservation_status != 'accepted' }}
                  then:
                    - action: system_log.write
                      data:
                        level: warning
                        logger: "{{ log_name }}"
                        message: >-
                          Not messaging Hospitable reservation
                          {{ reservation_uuid }}:
                          {{ 'reservation not found or lookup failed'
                          if reservation | count == 0
                          else 'status is ' ~ reservation_status }}.
                  else:
                    - variables:
                        guest_first_name: >-
                          {{ (reservation.guest
                          | default({}, true)).first_name
                          | default('there', true) | string | trim
                          or 'there' }}
                        property_name: >-
                          {%- set props = reservation.properties
                          | default([], true) -%}
                          {%- set name = (props[0].name
                          if props | count > 0
                          and props[0] is mapping
                          else '') | default('', true) -%}
                          {{ name if name | string | trim != ''
                          else state_attr(rc, 'friendly_name')
                          | default(rc, true) }}
                        check_in: >-
                          {%- set fmt = '%A, %B %d, %Y at %I:%M %p' -%}
                          {%- set d = as_datetime(
                          reservation.check_in | default('', true)
                          | string, none) -%}
                          {{ (d or as_datetime(rc_start))
                          .strftime(fmt) }}
                        check_out: >-
                          {%- set fmt = '%A, %B %d, %Y at %I:%M %p' -%}
                          {%- set d = as_datetime(
                          reservation.check_out | default('', true)
                          | string, none) -%}
                          {{ (d or as_datetime(rc_end))
                          .strftime(fmt) }}
                        due_date: >-
                          {{ (as_datetime(rc_end) | as_local)
                          .strftime('%Y-%m-%d') }}
                    - variables:
                        message_body: !input message_template
                        correction_body: !input correction_template
                    - variables:
                        final_body: >-
                          {{ correction_body
                          if is_correction
                          and correction_body | default('', true)
                          | string | trim != ''
                          else message_body }}
                    - if:
                        - condition: template
                          value_template: "{{ test_mode }}"
                      then:
                        - action: "{{ test_notify_service | trim }}"
                          continue_on_error: true
                          data:
                            title: Hospitable door code (TEST)
                            message: >-
                              {{ 'Correction' if is_correction
                              else 'Initial' }} message for
                              reservation {{ reservation_uuid }}:


                              {{ final_body }}
                      else:
                        # Record before sending so a failed record or a
                        # restart mid-send can never cause a resend.
                        - if:
                            - condition: template
                              value_template: >-
                                {{ tracker_matches | count > 0 }}
                          then:
                            - action: todo.update_item
                              target:
                                entity_id: "{{ sent_tracker }}"
                              data:
                                item: "{{ tracker_matches[0].uid }}"
                                description: "{{ door_code }}"
                                due_date: "{{ due_date }}"
                          else:
                            - action: todo.add_item
                              target:
                                entity_id: "{{ sent_tracker }}"
                              data:
                                item: "{{ reservation_uuid }}"
                                description: "{{ door_code }}"
                                due_date: "{{ due_date }}"
                        - variables:
                            send_result: {}
                        - action: hospitable.send_message
                          continue_on_error: true
                          data: >-
                            {{ dict(hospitable_extra,
                            reservation_uuid=reservation_uuid,
                            body=final_body | string) }}
                          response_variable: send_result
                        # An error can follow a send Hospitable accepted,
                        # so the record is kept to never message twice.
                        - if:
                            - condition: template
                              value_template: >-
                                {{ not (send_result is mapping
                                and send_result.accepted
                                | default(false) == true) }}
                          then:
                            - action: system_log.write
                              data:
                                level: warning
                                logger: "{{ log_name }}"
                                message: >-
                                  Could not confirm the door code
                                  message for Hospitable reservation
                                  {{ reservation_uuid }}. It is still
                                  recorded as sent so the guest is not
                                  messaged twice. Check the guest
                                  thread in Hospitable and delete the
                                  {{ reservation_uuid }} item from
                                  {{ sent_tracker }} to retry.
  - if:
      - condition: template
        value_template: "{{ not test_mode }}"
    then:
      - action: todo.get_items
        target:
          entity_id: "{{ sent_tracker }}"
        data:
          status:
            - needs_action
            - completed
        response_variable: tracker_response
      - variables:
          sent_items: >-
            {%- set ns = namespace(items=[]) -%}
            {%- set resp = tracker_response
            if tracker_response is mapping else {} -%}
            {%- set raw = (resp.get(sent_tracker) or {}).get('items')
            or [] -%}
            {%- for i in raw -%}
              {%- set ns.items = ns.items + [{
              'uid': i.uid | default('', true) | string,
              'summary': i.summary | default('', true) | string,
              'description': i.description
              | default('', true) | string | trim,
              'due': (i.due | default('', true) | string)[:10]
              }] -%}
            {%- endfor -%}
            {{ ns.items }}
      - variables:
          # Reservations still on an RC event sensor are kept even
          # when their recorded check-out date has passed.
          active_uuids: >-
            {%- set ns = namespace(uuids=[]) -%}
            {%- for e in rc_event_entities -%}
              {%- set uid = state_attr(e, 'uid') | string -%}
              {%- set end = as_datetime(state_attr(e, 'end'), none)
              if state_attr(e, 'end') is not none else none -%}
              {%- if has_value(e) and uid.endswith(uid_suffix)
              and (end is none or end > now()) -%}
                {%- set ns.uuids = ns.uuids
                + [uid[:-(uid_suffix | length)]] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.uuids }}
          expired_items: >-
            {%- set today = now().strftime('%Y-%m-%d') -%}
            {{ sent_items
            | selectattr('due', 'ne', '')
            | selectattr('uid', 'ne', '')
            | selectattr('due', 'lt', today)
            | rejectattr('summary', 'in', active_uuids)
            | map(attribute='uid') | list }}
      - if:
          - condition: template
            value_template: "{{ expired_items | count > 0 }}"
        then:
          - action: todo.remove_item
            target:
              entity_id: "{{ sent_tracker }}"
            data:
              item: "{{ expired_items }}"
